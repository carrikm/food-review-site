name: Keep Supabase awake

# Free Supabase projects pause after about a week of inactivity.
# This reads one row a day so the project always counts as active.
on:
  schedule:
    - cron: '17 12 * * *' # daily, 12:17 UTC
  workflow_dispatch: # allows running it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the reviews table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_KEY repository secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
